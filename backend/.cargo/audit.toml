[advisories]
ignore = [
    # rsa 0.9.10 - Marvin Attack timing side-channel (RUSTSEC-2023-0071)
    # Pulled in by jsonwebtoken 10.x. We use HS256 (HMAC) exclusively - RSA
    # code paths are never exercised. No fixed version of the rsa crate exists.
    #
    # Re-verified 2026-08-31 against the current lockfile. Worth restating
    # precisely, because this argument is about behaviour and not about the
    # dependency graph: rsa 0.9.10 IS compiled into the binary, under
    # jsonwebtoken 10.3.0, and `cargo tree -i rsa` shows the path. What holds is
    # that every mint site passes `Header::default()` and every verify site
    # builds on `Validation::default()`, both HS256 only in jsonwebtoken 10, so
    # a token signed with an RSA algorithm is rejected on algorithm before any
    # rsa code runs. `jsonwebtoken::Algorithm` is not referenced anywhere in
    # src/. Still no fixed rsa release as of this date.
    #
    # The entry stops applying the moment an asymmetric algorithm is introduced,
    # which would most likely arrive with OIDC id_token verification. Whoever
    # does that deletes this line first.
    "RUSTSEC-2023-0071",

    # rkyv 0.7.46 - out-of-bounds reads on archives containing Rc/Arc
    # (RUSTSEC-2026-0235). Pulled in by rust_decimal 1.41.0 under duckdb.
    #
    # Not fixable here. The advisory wants >=0.8.17, a major version, and the
    # choice belongs to duckdb and rust_decimal rather than to this crate. There
    # is no feature or version of duckdb available to us that drops it.
    #
    # Not compiled, measured 2026-09-04 against the current lockfile:
    # `cargo tree -i rkyv --target all` prints "nothing to print", while the
    # same command for `rsa` prints a real tree, so the absence is the tool
    # working rather than the tool failing. rust_decimal's own `rkyv` feature is
    # what is off.
    #
    # This is the weaker of the two arguments in this file, and deliberately so.
    # Unlike quinn-proto, whose parent `quinn` is absent from the graph
    # entirely, rkyv's parent rust_decimal IS compiled under duckdb. A feature
    # change in duckdb or rust_decimal, ours or theirs on a version bump, makes
    # rkyv live without anything in this repository looking different. So this
    # entry is the one to re-check after any dependency update, and the check is
    # the cargo tree line above rather than a reread of this comment.
    #
    # Ignored so `cargo audit` returns green and the next HIGH is visible on its
    # own rather than buried under a permanent red that everyone learns to scroll
    # past.
    "RUSTSEC-2026-0235",
]

# RUSTSEC-2026-0185, quinn-proto, CVSS 7.5: fixed rather than ignored on
# 2026-09-04 by `cargo update -p quinn-proto`, 0.11.14 -> 0.11.17, lockfile
# only. It had never been compiled either, by the same measurement, but a
# lockfile line is cheaper than carrying a reachability argument into every
# future audit run. That update added eight transitive crates, chacha20,
# cpufeatures, getrandom 0.4.3, r-efi, rand 0.10.2, rand_core 0.10.1,
# rand_pcg 0.10.2, and `cargo tree -i --target all` reports every one of them
# unreachable too, so nothing new reaches the binary.
