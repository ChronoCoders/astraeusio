[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Tilde, not caret. duckdb-rs encodes the engine in its second semver
# component, `1.MAJOR_MINOR_PATCH.x` from DuckDB 1.5.0, so `"1"` spanned DuckDB
# 1.5.2 to 2.0.1 and one argument-free `cargo update` would have replaced the
# storage engine. `~1.10506` allows crate patch releases for DuckDB 1.5.6 and
# refuses any engine move. AUD-068.
duckdb = { version = "~1.10506", features = ["bundled"] }
dotenvy = "0.15"
chrono = "0.4"
# 12 rather than 10 to remove crypto-bigint from the tree rather than patch it:
# 12 takes p256 0.14, which takes elliptic-curve 0.14, which has no
# crypto-bigint dependency at all. RUSTSEC-2026-0387, and its own fix target
# 0.7.6 is yanked. `rust_crypto` keeps the pure Rust backend rather than
# aws-lc-rs, which would add a C build to the image.
jsonwebtoken = { version = "12", features = ["rust_crypto"] }
bcrypt = "0.15"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
dashmap = "6"
resend-rs = "0.5"
totp-rs = { version = "5", features = ["gen_secret", "qr"] }
tower-http = { version = "0.6", features = ["cors"] }
chacha20poly1305 = "0.10"
quick-xml = { version = "0.42.0", default-features = false, features = ["escape-html"] }

[dev-dependencies]
# start_paused, for testing retry backoff without sleeping in real time.
# tokio's "full" feature deliberately excludes test-util.
tokio = { version = "1", features = ["test-util"] }
