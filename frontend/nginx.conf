server {
    listen 80;
    server_name _;
    return 301 https://astraeusio.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.astraeusio.com;
    ssl_certificate     /etc/ssl/astraeusio/selfsigned.crt;
    ssl_certificate_key /etc/ssl/astraeusio/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    return 301 https://astraeusio.com$request_uri;
}

# Authenticated Origin Pulls, in observe-only mode.
#
# $ssl_client_verify is SUCCESS, FAILED or NONE. Logging it with the issuer and
# the CF-Ray, whose suffix is the colo, proves what Cloudflare actually presents
# and from how many datacentres, before anything is allowed to reject a request.
log_format aop '$time_iso8601 verify=$ssl_client_verify ray=$http_cf_ray '
               'issuer="$ssl_client_i_dn" subject="$ssl_client_s_dn" '
               'remote=$remote_addr host=$host uri=$uri';

map $http_accept $wants_markdown {
    default          0;
    "~*text/markdown" 1;
}

# Anything whose SNI matches nothing, or whose Host header matches nothing,
# lands here instead of in the site block below.
#
# Defence in depth for the case the firewall is wrong again. On 2026-08-12 the
# origin served the entire application, 8324 bytes of it, to a request made
# straight to the IP with `Host: example.invalid`, because the site block was
# the default_server and therefore accepted every unmatched name.
server {
    listen 443 ssl default_server;
    server_name _;

    # Rejects the TLS handshake outright when the SNI matches no server_name,
    # which is what a scanner hitting the bare IP does. The client gets no
    # certificate and no response. This directive needs no certificate itself.
    ssl_reject_handshake on;

    # Reached when the handshake did complete against a real server name but
    # the Host header then matches nothing. 444 closes the connection with no
    # response line at all.
    return 444;
}

server {
    # Deliberately no longer default_server: unmatched names must fall to the
    # block above rather than being served the site.
    listen 443 ssl;
    server_name astraeusio.com;

    ssl_certificate     /etc/ssl/astraeusio/selfsigned.crt;
    ssl_certificate_key /etc/ssl/astraeusio/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Authenticated Origin Pulls, stage 1 of 2: OBSERVE ONLY.
    #
    # `optional` asks every client for a certificate and validates it against
    # the Cloudflare origin pull CA, but serves the request either way. That
    # makes the answer visible in the log without anything being able to reject
    # Cloudflare. Switching this to `on` is what enforces, and it is the one
    # change here that can take the site down with no way in through the normal
    # path, so it happens separately and deliberately.
    ssl_client_certificate /etc/nginx/cloudflare-origin-pull-ca.pem;
    ssl_verify_client      optional;

    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/aop.log    aop;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    include /etc/nginx/security-headers.conf;

    location = /index.md {
        default_type "text/markdown; charset=utf-8";
    }

    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /auth/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location = /mcp {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /.well-known/mcp/ {
        default_type "application/json";
        try_files $uri =404;
    }

    location = /.well-known/oauth-authorization-server {
        default_type "application/json";
        try_files $uri =404;
    }

    location = /.well-known/oauth-protected-resource {
        default_type "application/json";
        try_files $uri =404;
    }

    location = /.well-known/api-catalog {
        default_type "application/linkset+json";
        try_files $uri =404;
    }

    location = /.well-known/http-message-signatures-directory {
        default_type "application/jwk-set+json";
        try_files $uri =404;
    }

    location /.well-known/ {
        try_files $uri =404;
    }

    location = /status/feed.xml {
        types { } default_type "application/rss+xml; charset=utf-8";
        # This location declares an add_header of its own, which discards every
        # header inherited from the server block. Re-including them is what
        # keeps the feed from being served without nosniff.
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = / {
        if ($wants_markdown) {
            rewrite ^ /index.md last;
        }
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Internal listener. Plaintext on purpose, loopback only.
#
# Four callers need to reach this origin without presenting a client
# certificate: the frontend container healthcheck, deploy.sh's two post-deploy
# checks, and the host cron checks in component-check.sh and poller-check.sh
# that read /api/health. None of them can hold a Cloudflare origin pull
# certificate, and none of them should. They ask whether this origin is serving,
# not whether the edge trusts us.
#
# Before this existed all four reached the site block above, which asks every
# client for a certificate. That worked only because ssl_verify_client is
# `optional`, and nothing anywhere said so, so the site block could not be
# tightened without silently breaking four monitors at once.
#
# Plaintext rather than a second 443 block with verification turned off, because
# such a block would answer anyone who can open a connection to the origin IP
# and send its SNI. That is the bypass the catch-all block above and the
# DOCKER-USER rules exist to close. Published as 127.0.0.1:8081 in
# docker-compose.yml, so nothing off the box can reach it at all.
#
# It deliberately does not reproduce the .well-known locations or the markdown
# negotiation from the site block. Those serve external agents, not health
# checks, and a second copy would be a second thing to keep in step. What it
# does share is exactly what the checks exercise: the same static root and the
# same backend upstream.
server {
    listen 8081;
    server_name _;

    # Its own log. aop.log exists to record what Cloudflare presents, and 3349
    # loopback entries against 1174 real ones made that harder to read than it
    # needed to be.
    access_log /var/log/nginx/internal.log main;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # No security-headers include. Those are for browsers, and implying this
    # port is browser facing is the opposite of what it is for.

    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /auth/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
