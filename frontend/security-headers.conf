# Response headers shared by every location.
#
# nginx's add_header inheritance is all or nothing per level: a location that
# declares any add_header of its own silently discards every header inherited
# from the server block. `location = /status/feed.xml` set a Cache-Control and
# by doing so served the RSS feed with no nosniff, no SAMEORIGIN, no Link and
# no Vary. Keeping the shared set in one file and including it wherever a
# location needs a header of its own is what stops that from recurring.
#
# Anything added here must also be picked up by every location that has its own
# add_header. There is one today, and it includes this file.

add_header X-Content-Type-Options  nosniff    always;
add_header X-Frame-Options         SAMEORIGIN always;
# The verification and password reset links carry a single use token in their
# query string, so the property that matters is that a path and query never
# cross an origin boundary. Measured on the live /verify-email response before
# this was added: every subresource it loads is same origin and the rendered
# page carries no third party link, so nothing was leaking. This closes it
# before the first font, analytics tag or error reporter is added and starts
# sending somebody's account recovery token in Referer.
#
# strict-origin-when-cross-origin rather than same-origin or no-referrer. A
# cross origin request gets the bare origin, which keeps a referrer for the
# NASA image hosts in case hotlink protection is ever turned on there; sending
# nothing is the one way this change could break the APOD and EPIC imagery, and
# it would break it silently. Nothing in the backend reads Referer, so the same
# origin half costs nothing either way. Modern browsers already default to this
# value, which is the point: the property belongs to the response rather than
# to whatever the client happens to default to.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

add_header Link '</.well-known/api-catalog>; rel="api-catalog", </docs>; rel="service-doc", </sitemap.xml>; rel="sitemap", </.well-known/oauth-authorization-server>; rel="https://www.rfc-editor.org/rfc/rfc8414"' always;
add_header Vary                    Accept     always;

# Cloudflare already sends exactly this at the edge, so it introduces no new
# browser behaviour. It is set here because the origin can be reached directly
# when Cloudflare is bypassed, which is AUD-012, and a header that only exists
# at the edge is not a property of the service.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Report only, on purpose. This blocks nothing. It exists so violations show up
# in a browser console before the enforcing version is turned on, because a
# wrong policy takes out the globe or the NASA imagery and there is no report
# collector to catch that after the fact.
#
# Origins are derived from what the app actually loads, not from a template:
#   img-src      apod.nasa.gov and epic.gsfc.nasa.gov are rendered directly;
#                assets.science.nasa.gov and images-assets.nasa.gov appear in
#                NASA payloads. data: and blob: cover canvas and object URLs.
#   connect-src  api.bigdatacloud.net for reverse geocoding in lib/utils.js;
#                'self' covers /api and /auth.
#   script-src   'self' only. Everything is bundled; there is no CDN. The one
#                inline script is application/ld+json, which is data rather
#                than code, so blocking it would cost structured data and
#                nothing else.
#   style-src    'unsafe-inline' is required: React sets style attributes at
#                runtime and the noscript fallback carries an inline block.
#   there is no map tile origin, because the map is satellite.js and three,
#   both bundled locally. CLAUDE.md claims Leaflet; the code has no such
#   dependency.
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://apod.nasa.gov https://epic.gsfc.nasa.gov https://assets.science.nasa.gov https://images-assets.nasa.gov; connect-src 'self' https://api.bigdatacloud.net" always;
